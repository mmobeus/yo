# cargo-deny: `cargo xtask deny` checks licenses, bans and sources offline;
# `cargo xtask advisories` checks the RustSec database (needs the network).
#
# Loosening anything here (a license, a duplicate skipped, a source) needs
# the maintainer's explicit approval in the PR. See "How it's built" in
# docs/design/core.md.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "MIT",
  # unicode-ident's Unicode data tables (proc-macro2, so every derive macro)
  "Unicode-3.0",
]

[licenses.private]
# yo's own crates are unpublished (they're MIT, as LICENSE says).
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true

# Every crate yo may depend on, directly or not. A new dependency (and each
# crate it brings in) is added here, so it shows up in review.
allow = [
  # yo's own
  "xtask",
  "yo-app",
  "yo-cli",
  "yo-client",
  "yo-core",
  "yo-daemon",
  "yo-local",
  "yo-proto",
  "yo-tui",

  # serde_json: xtask's `cargo metadata`, and yo-core's config and ledger
  "itoa",
  "memchr",
  "serde_core",
  "serde_json",
  "zmij",

  # serde's derive, for yo-core's config, ledger and machine id types
  "proc-macro2",
  "quote",
  "serde",
  "serde_derive",
  "syn",
  "unicode-ident",

  # clap, for yo-cli's argument parsing, with what it brings for styled
  # output and its derive (windows-* only on Windows)
  "anstream",
  "anstyle",
  "anstyle-parse",
  "anstyle-query",
  "anstyle-wincon",
  "clap",
  "clap_builder",
  "clap_derive",
  "clap_lex",
  "colorchoice",
  "heck",
  "is_terminal_polyfill",
  "once_cell_polyfill",
  "strsim",
  "utf8parse",
  "windows-link",
  "windows-sys",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
