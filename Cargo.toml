[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
yo-core = { path = "crates/yo-core" }
yo-proto = { path = "crates/yo-proto" }
yo-local = { path = "crates/yo-local" }
yo-client = { path = "crates/yo-client" }
yo-daemon = { path = "crates/yo-daemon" }
yo-tui = { path = "crates/yo-tui" }
yo-testkit = { path = "crates/yo-testkit" }

serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
