[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
# A placeholder: a release takes its version from its tag (docs/dev/release.md).
version = "0.0.0-dev"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"

[workspace.dependencies]
yo-core = { path = "crates/yo-core" }
yo-proto = { path = "crates/yo-proto" }
yo-local = { path = "crates/yo-local" }
yo-client = { path = "crates/yo-client" }
yo-daemon = { path = "crates/yo-daemon" }
yo-tui = { path = "crates/yo-tui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
