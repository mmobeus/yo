[package]
name = "yo-cli"
description = "The yo command line, thin over yo-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "yo"
path = "src/main.rs"

[dependencies]
yo-core.workspace = true
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
yo-core = { workspace = true, features = ["fake"] }

[lints]
workspace = true
